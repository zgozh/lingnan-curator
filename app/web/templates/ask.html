{% extends "base.html" %}
{% block title %}问展馆 · 湾区记忆{% endblock %}
{% block scripts %}<script src="/static/ask.js" defer></script>{% endblock %}
{% block body %}
<h1>问展馆</h1>
<p class="hint">AI 讲解员只依据馆藏著录与画面作答；没有依据的问题会明确拒答，绝不编造史实。</p>
<div class="chiprow" id="ask-examples">
  <button class="chip" type="button">照片里的人在做什么？</button>
  <button class="chip" type="button">当时的人们穿什么衣服？</button>
  <button class="chip" type="button">画面的建筑有什么特点？</button>
  <button class="chip" type="button">这些街景反映了什么生活？</button>
</div>
<div id="chat-log"></div>
<form id="ask-form" class="searchbar">
  <input id="ask-q" placeholder="例如：西关大屋有什么特点？" autocomplete="off">
  <button>提问</button>
</form>
{% endblock %}
