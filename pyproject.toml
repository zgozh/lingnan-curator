[project]
name = "lingnan-curator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.27.1",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "flagembedding>=1.4.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "openai>=3.3.1",
    "pillow>=12.3.0",
    "pillow-avif-plugin>=1.6.0",
    "pymilvus>=3.0.1",
    "python-dotenv>=1.2.3",
    "ragas>=0.3.1",
    "rapidocr-onnxruntime>=1.4.4",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# torch 切 CUDA 构建（RTX 4060）：嵌入/精排上 GPU，候选多时不再超时
# cu121 最高只有 torch2.5；2.13 的 win 轮子在 cu126
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["e2e: 真实链路集成测试(需外部服务)"]
