[project]
name = "lingnan-curator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.27.1",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "flagembedding>=1.4.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "openai>=3.3.1",
    "pillow>=12.3.0",
    "pillow-avif-plugin>=1.6.0",
    "pymilvus>=3.0.1",
    "python-dotenv>=1.2.3",
    "ragas>=0.3.1",
    "rapidocr-onnxruntime>=1.4.4",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["e2e: 真实链路集成测试(需外部服务)"]
